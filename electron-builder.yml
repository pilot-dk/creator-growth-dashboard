appId: com.pilotdk.creatorgrowthdashboard
productName: Creator Growth Dashboard
copyright: Copyright © 2026 djdaka

directories:
  output: release

files:
  - out/**/*
  - package.json

afterPack: scripts/afterPack.cjs

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # No Apple Developer certificate is wired up for this open-source build, so
  # electron-builder's own signing/notarization is disabled — scripts/afterPack.cjs
  # ad-hoc signs the bundle instead (see that file for why). Users still need to
  # right-click → Open the first time (documented in the README).
  identity: null
  hardenedRuntime: false

dmg:
  title: 'Creator Growth Dashboard'

publish:
  provider: github
  owner: pilot-dk
  repo: creator-growth-dashboard
